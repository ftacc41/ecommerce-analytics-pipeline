version: 2

models:
  - name: fct_orders
    description: "Order-level fact table with metrics and foreign keys to dimensions"
    columns:
      - name: order_id
        description: "Primary key - unique identifier for each order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers"
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: customer_unique_id
        description: "Customer unique identifier"
      - name: order_status
        description: "Current order status"
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'approved', 'canceled', 'unavailable', 'invoiced', 'processing', 'created']
      - name: total_revenue
        description: "Total revenue for the order"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: item_count
        description: "Number of items in the order"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1

  - name: fct_order_items
    description: "Order item-level fact table with item metrics"
    columns:
      - name: order_id
        description: "Foreign key to fct_orders"
        tests:
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: order_item_id
        description: "Item sequence number within order"
      - name: product_id
        description: "Foreign key to dim_products"
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        description: "Foreign key to dim_sellers"
        tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: price
        description: "Price of the item"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_customers
    description: "Customer dimension with attributes and calculated fields"
    columns:
      - name: customer_unique_id
        description: "Primary key - unique customer identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Order-level customer ID"
      - name: total_orders
        description: "Total number of orders placed"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: lifetime_value
        description: "Customer lifetime value"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_products
    description: "Product dimension with catalog information"
    columns:
      - name: product_id
        description: "Primary key - unique product identifier"
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Product category name"
      - name: total_revenue
        description: "Total revenue generated by product"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_sellers
    description: "Seller dimension with performance metrics"
    columns:
      - name: seller_id
        description: "Primary key - unique seller identifier"
        tests:
          - unique
          - not_null
      - name: total_revenue
        description: "Total revenue generated by seller"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: dim_dates
    description: "Date dimension for time-based analysis"
    columns:
      - name: date_key
        description: "Primary key - date in YYYY-MM-DD format"
        tests:
          - unique
          - not_null

  - name: dim_geolocation
    description: "Geographic dimension"
    columns:
      - name: zip_code_prefix
        description: "Primary key - zip code prefix"
        tests:
          - unique
          - not_null

  - name: revenue_metrics
    description: "Revenue aggregations by various dimensions"
    columns:
      - name: dimension_type
        description: "Type of dimension (date, state, category)"
      - name: dimension_value
        description: "Value of the dimension"
      - name: revenue
        description: "Total revenue for this dimension value"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: customer_metrics
    description: "Customer metrics for cohort analysis"
    columns:
      - name: customer_unique_id
        description: "Foreign key to dim_customers"
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      - name: total_orders
        description: "Total number of orders"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1

  - name: product_metrics
    description: "Product performance rankings"
    columns:
      - name: product_id
        description: "Foreign key to dim_products"
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: revenue_rank
        description: "Rank by revenue (1 = highest revenue)"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
