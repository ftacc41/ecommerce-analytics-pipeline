version: 2

models:
  - name: int_order_revenue
    description: "Order-level revenue calculated from payment data"
    columns:
      - name: order_id
        description: "Foreign key to order"
        tests:
          - unique
          - not_null
      - name: total_revenue
        description: "Total revenue for the order (sum of all payments)"
      - name: payment_count
        description: "Number of payment transactions for the order"

  - name: int_customer_orders
    description: "Customer-level order aggregations"
    columns:
      - name: customer_id
        description: "Foreign key to customer"
        tests:
          - unique
          - not_null
      - name: total_orders
        description: "Total number of orders placed by customer"
      - name: first_order_date
        description: "Date of customer's first order"
      - name: last_order_date
        description: "Date of customer's most recent order"

  - name: int_product_performance
    description: "Product-level performance metrics"
    columns:
      - name: product_id
        description: "Foreign key to product"
        tests:
          - unique
          - not_null
      - name: order_count
        description: "Number of orders containing this product"
      - name: total_revenue
        description: "Total revenue generated by this product"
      - name: avg_review_score
        description: "Average review score for this product"

  - name: int_delivery_performance
    description: "Delivery time and performance metrics"
    columns:
      - name: order_id
        description: "Foreign key to order"
        tests:
          - unique
          - not_null
      - name: total_delivery_time_days
        description: "Total time from purchase to delivery in days"
      - name: delivery_delay_days
        description: "Days delayed from estimated delivery (negative = early)"

  - name: int_order_status_timeline
    description: "Order status progression and timeline"
    columns:
      - name: order_id
        description: "Foreign key to order"
        tests:
          - unique
          - not_null
      - name: order_status
        description: "Current order status"
      - name: current_stage
        description: "Current stage in order lifecycle"
      - name: is_complete
        description: "Whether order is complete (delivered)"
